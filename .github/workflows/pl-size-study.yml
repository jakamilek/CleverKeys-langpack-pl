# Study workflow intentionally rerun on source/workflow changes for reproducible
# 50k/100k/125k/150k comparison.
# The candidate depth is deliberately 300k so the 150k target is not constrained
# by the raw wordfreq window after evidence filtering and category augmentation.
name: Polish dictionary size study

on:
  workflow_dispatch:
  push:
    branches:
      - "ops/baseline-sync-2026-09-20"
    paths:
      - ".github/workflows/pl-size-study.yml"
      - "scripts/build_pl_preview.py"
      - "scripts/analyze_dictionary_modules.py"
      - "scripts/requirements-pl-audit.txt"
      - "scripts/fetch_nkjp1m.py"
      - "sources/staging/autocorrect_errors.tsv"
      - "sources/staging/historical_name_candidates.tsv"
      - "sources/staging/first_name_surface_policy.tsv"
      - "sources/staging/custom_manual.tsv"
      - "sources/staging/surface_registry_policy.tsv"
      - "scripts/audit_name_history.py"
      - "scripts/fetch_teryt_simc.py"
      - "scripts/fetch_teryt_terc.py"
      - "scripts/extract_teryt_terc.py"
      - "scripts/generate_terc_inflections.py"
      - "scripts/select_terc_inflections.py"
      - "scripts/fetch_ksng_countries_capitals.py"
      - "scripts/extract_ksng_countries_capitals.py"
      - "scripts/generate_ksng_inflections.py"
      - "scripts/extract_teryt_cities.py"
      - "scripts/generate_first_name_inflections.py"
      - "scripts/generate_city_inflections.py"
      - "sources/staging/reviewed_city_inflection_priority.tsv"
      - "sources/staging/reviewed_city_inflection_overrides.tsv"
      - "docs/PL_NAME_HISTORY_SOURCE_POLICY_2026-09-23.md"
      - "docs/PL_COUNTRY_CAPITAL_SOURCE_POLICY_2026-09-25.md"

permissions:
  contents: read

jobs:
  size-study:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout language project
        uses: actions/checkout@v4

      - name: Install Polish spelling oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y hunspell hunspell-pl poppler-utils

      - name: Install pinned wordfreq
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r scripts/requirements-pl-audit.txt

      - name: Acquire pinned AOSP Polish dictionary
        run: |
          mkdir -p build/aosp
          curl --fail --retry 6 --retry-delay 3 --retry-all-errors --location             'https://android.googlesource.com/platform/packages/inputmethods/LatinIME/+/refs/heads/main/dictionaries/pl_wordlist.combined.gz?format=TEXT'             -o build/aosp/pl_wordlist.combined.gz.base64
          base64 --decode build/aosp/pl_wordlist.combined.gz.base64 > build/aosp/pl_wordlist.combined.gz
          sha256sum build/aosp/pl_wordlist.combined.gz | awk '{print $1}' > build/aosp/pl_wordlist.combined.gz.sha256
          test "$(cat build/aosp/pl_wordlist.combined.gz.sha256)" = "75a7a488e014ec3b9dbdb2527f09bca6bb28c250232d9ba50cb0ee1f8738ea45"

      - name: Acquire and validate pinned NKJP1M frequency table (SHA-256 pinned)
        run: |
          python3 scripts/fetch_nkjp1m.py             --out build/nkjp/NKJP1M-tagged-frequency.tab             --out-sha256 build/nkjp/NKJP1M-tagged-frequency.tab.sha256             --out-provenance build/nkjp/NKJP1M-tagged-frequency.provenance.json             --expected-sha256 fee31b1d6a682970b4e8ca68b593aea8dadbc8541e875e2d287480d83601e79c

      - name: Acquire current official TERYT TERC catalog
        run: |
          mkdir -p build/teryt
          python3 scripts/fetch_teryt_terc.py             --state-date 2026-09-25             --out-zip build/teryt/TERC_Urzedowy_2026-01-01.zip             --out-sha256 build/teryt/TERC_Urzedowy_2026-01-01.sha256             --out-provenance build/teryt/TERC-source-ref.json
          python3 scripts/extract_teryt_terc.py             --zip build/teryt/TERC_Urzedowy_2026-01-01.zip             --out-tsv build/pl-terc-source.tsv             --out-flat-tsv build/pl-terc-flat.tsv             --out-report build/pl-terc-source-report.json

      - name: Acquire current official TERYT SIMC catalog
        run: |
          mkdir -p build/teryt
          python3 scripts/fetch_teryt_simc.py \
            --state-date 2026-09-24 \
            --out-zip build/teryt/SIMC_Urzedowy_2026-09-24.zip \
            --out-sha256 build/teryt/SIMC_Urzedowy_2026-09-24.sha256 \
            --out-provenance build/teryt/source-ref.json
          python3 scripts/extract_teryt_cities.py \
            --zip build/teryt/SIMC_Urzedowy_2026-09-24.zip \
            --out-tsv build/pl-city-source.tsv \
            --out-report build/pl-city-source-report.json

      - name: Acquire official KSNG country/capital list
        run: |
          mkdir -p build/ksng
          python3 scripts/fetch_ksng_countries_capitals.py             --out-main build/ksng/ksng-2025.pdf             --out-main-sha256 build/ksng/ksng-2025.sha256             --out-update build/ksng/ksng-update-1-2026.pdf             --out-update-sha256 build/ksng/ksng-update-1-2026.sha256             --out-provenance build/ksng/source-ref.json
          python3 scripts/extract_ksng_countries_capitals.py             --main-pdf build/ksng/ksng-2025.pdf             --update-pdf build/ksng/ksng-update-1-2026.pdf             --out-countries build/pl-country-source.tsv             --out-countries-flat build/pl-country-flat.tsv             --out-capitals build/pl-capital-source.tsv             --out-capitals-flat build/pl-capital-flat.tsv             --out-report build/pl-country-capital-source-report.json

      - name: Generate country and capital inflections
        run: |
          python3 scripts/generate_ksng_inflections.py             --countries build/pl-country-flat.tsv             --capitals build/pl-capital-flat.tsv             --out-countries build/pl-country-inflections.tsv             --out-capitals build/pl-capital-inflections.tsv             --out-report build/pl-country-capital-inflections-report.json

      - name: Audit official modern first-name core
        run: |
          python3 scripts/audit_name_history.py             --out-report build/pl-name-history-report.json             --out-tsv build/pl-name-history.tsv             --out-core build/pl-name-history-core-215-each-gender.txt             --out-buffer build/pl-name-history-buffer-216-300.tsv             --workdir build/pl-name-history-sources             --core-per-gender 215             --buffer-end-rank 300

      - name: Audit first-name common-noun homonyms
        run: |
          python3 scripts/audit_first_name_homonyms.py             --history-report build/pl-name-history-report.json             --historical-first-names sources/staging/historical_name_candidates.tsv             --out-json build/pl-first-name-homonym-audit.json             --out-tsv build/pl-first-name-homonym-audit.tsv             --out-blocklist build/pl-first-name-capitalized-homonyms.txt --surface-policy sources/staging/first_name_surface_policy.tsv

      - name: Generate selected first-name inflections
        run: |
          python3 scripts/generate_first_name_inflections.py \
            --history-report build/pl-name-history-report.json \
            --historical-first-names sources/staging/historical_name_candidates.tsv \
            --surface-policy sources/staging/first_name_surface_policy.tsv \
            --out-tsv build/pl-first-name-inflections.tsv \
            --out-report build/pl-first-name-inflections-report.json
          python3 scripts/generate_city_inflections.py \
            --cities build/pl-city-source.tsv \
            --priorities sources/staging/reviewed_city_inflection_priority.tsv \
            --top-n 300 \
            --out-tsv build/pl-city-inflections.tsv \
            --out-report build/pl-city-inflections-report.json \
            --overrides sources/staging/reviewed_city_inflection_overrides.tsv

      - name: Generate full TERC administrative inflections and select production retention
        run: |
          python3 scripts/generate_terc_inflections.py             --terc build/pl-terc-flat.tsv             --out-tsv build/pl-terc-inflections.tsv             --out-report build/pl-terc-inflections-report.json
          python3 scripts/select_terc_inflections.py             --input build/pl-terc-inflections.tsv             --nkjp build/nkjp/NKJP1M-tagged-frequency.tab             --out build/pl-terc-inflections-selected.tsv             --out-report build/pl-terc-retention-report.json
      - name: Pin CleverKeys runtime
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/tribixbite/CleverKeys.git build/CleverKeys-runtime
          git -C build/CleverKeys-runtime fetch --depth=1 origin 263bd0abc03dec420f60fa073a9d2c5e25a176b5
          git -C build/CleverKeys-runtime checkout --detach 263bd0abc03dec420f60fa073a9d2c5e25a176b5
          test "$(git -C build/CleverKeys-runtime rev-parse HEAD)" = "263bd0abc03dec420f60fa073a9d2c5e25a176b5"

      - name: Build 50k, 100k, 125k and 150k variants from a common 300k candidate window
        run: |
          set -euo pipefail
          python3 build/CleverKeys-runtime/scripts/generate_unigrams.py             --lang pl             --output build/unigrams.txt             --top-n 5000

          for limit in 50000 100000 125000 150000; do
            mkdir -p "build/study/$limit"
            python3 scripts/build_pl_preview.py               --top 200000               --band "$limit"               --limit "$limit"               --aosp build/aosp/pl_wordlist.combined.gz               --first-name-history build/pl-name-history-report.json               --historical-first-names sources/staging/historical_name_candidates.tsv               --first-name-surface-policy sources/staging/first_name_surface_policy.tsv               --first-name-inflections build/pl-first-name-inflections.tsv               --cities build/pl-city-source.tsv               --city-inflections build/pl-city-inflections.tsv               --terc-inflections build/pl-terc-inflections-selected.tsv               --countries build/pl-country-flat.tsv               --country-inflections build/pl-country-inflections.tsv               --capitals build/pl-capital-flat.tsv               --capital-inflections build/pl-capital-inflections.tsv               --out-wordlist "build/study/$limit/pl_words_preview.txt"               --out-report "build/study/$limit/pl-preview-report.json"

            python3 build/CleverKeys-runtime/scripts/build_dictionary.py               --lang pl               --input "build/study/$limit/pl_words_preview.txt"               --output "build/study/$limit/dictionary.bin"               --use-wordfreq

            python3 build/CleverKeys-runtime/scripts/build_langpack.py               --lang pl               --name "Polish $limit"               --dict "build/study/$limit/dictionary.bin"               --unigrams build/unigrams.txt               --version 2               --author "jakamilek/CleverKeys-langpack-pl"               --output "build/study/$limit/cleverkeys-langpack-pl-$limit.zip"
            sha256sum "build/study/$limit/cleverkeys-langpack-pl-$limit.zip" > "build/study/$limit/cleverkeys-langpack-pl-$limit.sha256"
          done

      - name: Build immutable 100k frequency core
        run: |
          python3 scripts/build_pl_preview.py               --base-only               --top 300000               --band 100000               --limit 100000               --aosp build/aosp/pl_wordlist.combined.gz               --out-wordlist build/base100k.txt               --out-report build/base100k-report.json

      - name: Measure net module cost over immutable 100k core
        run: |
          python3 scripts/analyze_dictionary_modules.py             --base build/base100k.txt             --module first_name_forms=build/pl-first-name-inflections.tsv:form             --module city_names=build/pl-city-source.tsv:name             --module city_inflections=build/pl-city-inflections.tsv:form             --module custom_manual=sources/staging/custom_manual.tsv:surface             --module terc_inflections=build/pl-terc-inflections-selected.tsv:form             --module countries=build/pl-country-flat.tsv:name             --module country_inflections=build/pl-country-inflections.tsv:form             --module capitals=build/pl-capital-flat.tsv:name             --module capital_inflections=build/pl-capital-inflections.tsv:form             --out build/study/module-study-report.json

      - name: Audit module frequency with NKJP primary and wordfreq secondary
        run: |
          python3 scripts/audit_module_frequency.py             --nkjp build/nkjp/NKJP1M-tagged-frequency.tab             --module first_name_forms=build/pl-first-name-inflections.tsv:form             --module city_names=build/pl-city-source.tsv:name             --module city_inflections=build/pl-city-inflections.tsv:form             --module custom_manual=sources/staging/custom_manual.tsv:surface             --module terc_inflections=build/pl-terc-inflections-selected.tsv:form             --module countries=build/pl-country-flat.tsv:name             --module country_inflections=build/pl-country-inflections.tsv:form             --module capitals=build/pl-capital-flat.tsv:name             --module capital_inflections=build/pl-capital-inflections.tsv:form             --out build/study/module-frequency-report.json

      - name: Compare coverage and audit CKDTs
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path

          root = Path("build/study")
          sizes = [50000, 100000, 125000, 150000]
          words = {}
          reports = {}

          for size in sizes:
              words[size] = {
                  line.strip()
                  for line in (root / str(size) / "pl_words_preview.txt").read_text(encoding="utf-8").splitlines()
                  if line.strip() and not line.startswith("#")
              }
              reports[size] = json.loads(
                  (root / str(size) / "pl-preview-report.json").read_text(encoding="utf-8")
              )

          for size in sizes:
              assert len(words[size]) <= size, (
                  size,
                  len(words[size]),
                  reports[size]["candidate_count"],
              )
          terc_rows = list(__import__("csv").DictReader(
              Path("build/pl-terc-flat.tsv").open(encoding="utf-8", newline=""),
              delimiter="\t",
          ))
          terc_names = {row["name"] for row in terc_rows}
          terc_full_rows = list(__import__("csv").DictReader(
              Path("build/pl-terc-inflections.tsv").open(encoding="utf-8", newline=""),
              delimiter="\t",
          ))
          terc_inflection_rows = list(__import__("csv").DictReader(
              Path("build/pl-terc-inflections-selected.tsv").open(encoding="utf-8", newline=""),
              delimiter="\t",
          ))
          terc_inflections = {row["form"] for row in terc_inflection_rows}
          selected_terc_keys = {(row["level"], row["terc"], row["case"], row["form"]) for row in terc_inflection_rows}
          for row in terc_full_rows:
              key = (row["level"], row["terc"], row["case"], row["form"])
              if row["level"] == "voivodeship":
                  assert key in selected_terc_keys
              elif row["level"] == "gmina" and row["case"] != "nom":
                  assert key not in selected_terc_keys
          assert all(row["case"] == "nom" or row["level"] != "gmina" for row in terc_inflection_rows)
          city_names = {
              row["name"]
              for row in __import__("csv").DictReader(
                  (Path("build/pl-city-source.tsv").open(encoding="utf-8", newline="")),
                  delimiter="\t",
              )
          }
          city_inflections = {
              row["form"]
              for row in __import__("csv").DictReader(
                  (Path("build/pl-city-inflections.tsv").open(encoding="utf-8", newline="")),
                  delimiter="\t",
              )
          }
          first_name_inflections = {
              row["form"]
              for row in __import__("csv").DictReader(
                  (Path("build/pl-first-name-inflections.tsv").open(encoding="utf-8", newline="")),
                  delimiter="\t",
              )
          }

          def read_ckdt(path, expected_count):
              data = path.read_bytes()
              magic, version = struct.unpack_from("<II", data, 0)
              assert magic == 0x54444B43 and version == 2
              count = struct.unpack_from("<I", data, 12)[0]
              assert count == expected_count, (path, count, expected_count)
              p = 48
              out = set()
              raw = set()
              for _ in range(count):
                  n = struct.unpack_from("<H", data, p)[0]
                  p += 2
                  word = data[p:p+n].decode("utf-8")
                  raw.add(word)
                  out.add(word.lower())
                  p += n + 1
              assert len(out) == count, f"duplicate CKDT entries in {path}"
              return raw, out

          ckdt_raw = {}
          ckdt = {}
          for size in sizes:
              raw, normalized = read_ckdt(
                  root / str(size) / "dictionary.bin",
                  len(words[size]),
              )
              ckdt_raw[size] = raw
              ckdt[size] = normalized

          import zipfile

          for size in sizes:
              pack = root / str(size) / f"cleverkeys-langpack-pl-{size}.zip"
              with zipfile.ZipFile(pack) as zf:
                  assert zf.namelist() == ["dictionary.bin", "manifest.json", "unigrams.txt"], (
                      size, zf.namelist()
                  )
                  manifest = json.loads(zf.read("manifest.json"))
                  assert manifest["code"] == "pl", (size, manifest)
                  assert manifest["version"] == 2, (size, manifest)
                  assert manifest["wordCount"] == len(words[size]), (size, manifest)
                  assert manifest["hasPrefixBoost"] is False, (size, manifest)
              missing_terc = sorted({w.lower() for w in terc_names} - ckdt[size])
              assert not missing_terc, f"{size}: missing TERC names: {', '.join(missing_terc)}"
              missing_terc_inflections = sorted({w.lower() for w in terc_inflections} - ckdt[size])
              assert not missing_terc_inflections, f"{size}: missing TERC inflections: {', '.join(missing_terc_inflections)}"

              missing_city = sorted({w.lower() for w in city_names} - ckdt[size])
              assert not missing_city, f"{size}: missing official city names: {', '.join(missing_city)}"
              missing_city_inflections = sorted({w.lower() for w in city_inflections} - ckdt[size])
              assert not missing_city_inflections, (
                  f"{size}: missing selected city inflections: {', '.join(missing_city_inflections)}"
              )
              missing_first_name_inflections = sorted(
                  {w.lower() for w in first_name_inflections} - ckdt[size]
              )
              assert not missing_first_name_inflections, (
                  f"{size}: missing selected first-name inflections: "
                  f"{', '.join(missing_first_name_inflections)}"
              )
          forbidden = {
              "chopin", "chopina", "goebbels", "goebbelsa",
              "catherine", "catalina", "cameron", "carli", "carlo",
              "castillo", "cali", "celli", "casino", "calli",
              "carrillo", "caroli", "cassino", "compos", "gourami",
              "celastial",
          }
          regression_hits = {
              size: sorted(ckdt[size] & forbidden)
              for size in sizes
          }
          assert all(not hits for hits in regression_hits.values()), regression_hits

          result = {
              "candidate_window": 300000,
              "variants": {},
              "comparisons": {
                  "added_100k_vs_50k": sorted(words[100000] - words[50000]),
                  "added_125k_vs_100k": sorted(words[125000] - words[100000]),
                  "added_150k_vs_125k": sorted(words[150000] - words[125000]),
                  "added_150k_vs_100k": sorted(words[150000] - words[100000]),
                  "added_150k_vs_50k": sorted(words[150000] - words[50000]),
              },
          }

          for size in sizes:
              report = reports[size]
              result["variants"][str(size)] = {
                  "requested_limit": size,
                  "terc_names_present": len(terc_names),
                  "terc_inflection_forms_present": len(terc_inflections),
                  "kept": report["kept"],
                  "candidate_count": report["candidate_count"],                  "drop_reasons": report["drop_reasons"],
                  "dictionary_bytes": (root / str(size) / "dictionary.bin").stat().st_size,                  "city_names_present": len(city_names),
                  "city_inflection_forms_present": len(city_inflections),
                  "regression_hits": regression_hits[size],
              }

          result["marginal_gain"] = {
              "50_to_100": {
                  "new_words": len(words[100000] - words[50000]),
                  "new_words_from_50k_to_100k_pct": round(
                      100 * len(words[100000] - words[50000]) / 50000, 2
                  ),
              },
              "100_to_125": {
                  "new_words": len(words[125000] - words[100000]),
                  "new_words_from_100k_to_125k_pct": round(
                      100 * len(words[125000] - words[100000]) / 100000, 2
                  ),
              },
              "125_to_150": {
                  "new_words": len(words[150000] - words[125000]),
                  "new_words_from_125k_to_150k_pct": round(
                      100 * len(words[150000] - words[125000]) / 125000, 2
                  ),
              },
          }

          result["importable_packs"] = {
              str(size): {
                  "zip": str(root / str(size) / f"cleverkeys-langpack-pl-{size}.zip"),
                  "sha256": (root / str(size) / f"cleverkeys-langpack-pl-{size}.sha256")
                  .read_text(encoding="utf-8").split()[0],
              }
              for size in sizes
          }

          Path("build/study/size-study-report.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result["variants"], ensure_ascii=False, indent=2))
          print(json.dumps(result["marginal_gain"], ensure_ascii=False, indent=2))
          PY

      - name: Publish size-study artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cleverkeys-pl-size-study
          path: |
            build/study/size-study-report.json
            build/study/50000/pl-preview-report.json
            build/study/50000/pl_words_preview.txt
            build/study/50000/dictionary.bin
            build/study/75000/pl-preview-report.json
            build/study/75000/pl_words_preview.txt
            build/study/75000/dictionary.bin
            build/study/100000/pl-preview-report.json
            build/study/100000/pl_words_preview.txt
            build/study/100000/dictionary.bin
            build/study/50000/cleverkeys-langpack-pl-50000.zip
            build/study/50000/cleverkeys-langpack-pl-50000.sha256
            build/study/75000/cleverkeys-langpack-pl-75000.zip
            build/study/75000/cleverkeys-langpack-pl-75000.sha256
            build/study/100000/cleverkeys-langpack-pl-100000.zip
            build/study/100000/cleverkeys-langpack-pl-100000.sha256
            build/base100k.txt
            build/base100k-report.json
            build/study/module-study-report.json
            build/study/module-frequency-report.json
            build/nkjp/NKJP1M-tagged-frequency.tab.sha256
            build/nkjp/NKJP1M-tagged-frequency.provenance.json
            build/aosp/pl_wordlist.combined.gz.sha256
            build/teryt/SIMC_Urzedowy_2026-09-24.zip
            build/teryt/SIMC_Urzedowy_2026-09-24.sha256
            build/teryt/source-ref.json
            build/pl-city-source.tsv
            build/pl-city-source-report.json
            build/pl-first-name-inflections.tsv
            build/pl-first-name-inflections-report.json
            build/pl-city-inflections.tsv
            build/pl-city-inflections-report.json
            build/teryt/TERC_Urzedowy_2026-01-01.zip
            build/teryt/TERC_Urzedowy_2026-01-01.sha256
            build/teryt/TERC-source-ref.json
            build/pl-terc-source.tsv
            build/pl-terc-flat.tsv
            build/pl-terc-source-report.json
            build/pl-terc-inflections.tsv
            build/pl-terc-inflections-selected.tsv
            build/pl-terc-inflections-report.json
            build/pl-terc-retention-report.json
            build/ksng/ksng-2025.pdf
            build/ksng/ksng-2025.sha256
            build/ksng/ksng-update-1-2026.pdf
            build/ksng/ksng-update-1-2026.sha256
            build/ksng/source-ref.json
            build/pl-country-source.tsv
            build/pl-country-flat.tsv
            build/pl-capital-source.tsv
            build/pl-capital-flat.tsv
            build/pl-country-capital-source-report.json
            build/pl-country-inflections.tsv
            build/pl-capital-inflections.tsv
            build/pl-country-capital-inflections-report.json
