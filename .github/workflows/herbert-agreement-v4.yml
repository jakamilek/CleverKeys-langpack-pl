name: HerBERT agreement diagnostic v4
on:
  push:
    branches: ['experiment/herbert-form-diagnostic-v1']
    paths:
      - 'experiments/herbert_agreement_v4/**'
      - '.github/workflows/herbert-agreement-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve original contracts and verify frozen diagnostic
        run: |
          set -euo pipefail
          python3 -m unittest discover -s experiments/herbert_mobile_v1 -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/herbert_fp32_benchmark_v1 -p 'test_*.py' -v
          python3 -m unittest discover -s experiments/herbert_form_diagnostic_v1 -p 'test_*.py' -v
          python3 experiments/herbert_form_diagnostic_v1/diagnose.py --contract-only
          python3 -m unittest discover -s experiments/herbert_form_diagnostic_v2 -p 'test_*.py' -v
          python3 experiments/herbert_form_diagnostic_v2/replay.py --contract-only
          python3 -m unittest discover -s experiments/herbert_context_gain_v3 -p 'test_*.py' -v
          python3 experiments/herbert_context_gain_v3/measure.py --contract-only
          python3 -m unittest discover -s experiments/herbert_agreement_v4 -p 'test_*.py' -v
          python3 experiments/herbert_agreement_v4/measure.py --contract-only
  measure:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve exact original FP32 phone bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11312693984'
          run-id: 37230171787
          github-token: ${{ github.token }}
          merge-multiple: true
          path: build/herbert-original
      - name: Retrieve exact original source dictionary pack
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11303920512'
          run-id: 37202645255
          github-token: ${{ github.token }}
          merge-multiple: true
          path: build/dict-original
      - name: Re-extract exact frozen source evidence
        run: python3 experiments/herbert_agreement_v4/source.py --pack build/dict-original/cleverkeys-pl-global-casing-trial.zip --verify
      - name: Install pinned inference runtime
        run: |
          set -euo pipefail
          python3 -m pip install -r experiments/herbert_form_diagnostic_v1/requirements.txt
          python3 -m pip freeze > build/herbert-form-environment.txt
      - name: Real FP32 grammatical agreement then original case evaluation
        run: |
          set -euo pipefail
          python3 experiments/herbert_agreement_v4/measure.py --bundle build/herbert-original --source-pack build/dict-original/cleverkeys-pl-global-casing-trial.zip --out build/herbert-agreement-v4
          cat build/herbert-agreement-v4/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve reports only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: herbert-agreement-v4-reports
          path: |
            build/herbert-agreement-v4/
            build/herbert-form-environment.txt
          retention-days: 30
