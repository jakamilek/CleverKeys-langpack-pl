name: Build CleverKeys Polish language pack

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source files
        run: |
          test -f source/pl_PL.aff
          test -f source/core_words.dic
          test -f source/colloquial.dic
          test -f source/tech.dic
          test -f source/corrections.txt

      - name: Build package
        run: |
          chmod +x scripts/build_pl.sh
          ./scripts/build_pl.sh

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: cleverkeys-langpack-pl
          path: |
            cleverkeys-langpack-pl.zip
            cleverkeys-langpack-pl.sha256
