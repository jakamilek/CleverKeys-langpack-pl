name: Additive deferred Polish names v10

on:
  push:
    branches: ['feature/additive-common-forms-v1']
    paths:
      - 'scripts/build_deferred_names_trial.py'
      - 'scripts/check_deferred_names_consumer.py'
      - 'tests/test_deferred_names_trial.py'
      - 'tests/DeferredNamesConsumerCheck.kt'
      - 'docs/deferred-names-trial-v1/**'
      - '.github/workflows/deferred-names-trial.yml'
  pull_request:
    paths:
      - 'scripts/build_deferred_names_trial.py'
      - 'scripts/check_deferred_names_consumer.py'
      - 'tests/test_deferred_names_trial.py'
      - 'tests/DeferredNamesConsumerCheck.kt'
      - 'docs/deferred-names-trial-v1/**'
      - '.github/workflows/deferred-names-trial.yml'

permissions:
  contents: read
  actions: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install exact source snapshots
        run: |
          python -m pip install morfeusz2==1.99.15 requests \
            'wordfreq @ git+https://github.com/rspeer/wordfreq@912caf64b657478d1dff1138efdc078947d54bb1'
      - name: Verify complete producer regressions
        run: python -m unittest discover -s tests -v
      - name: Retrieve successful phone-accepted v9
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38173087935
          name: cleverkeys-pl-shared-metadata-trial
          path: build/base-v9
      - name: Retrieve complete pinned v8 source audit
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38167348861
          name: cleverkeys-pl-names-forms-trial
          path: build/source-v8
      - name: Measure deferred pool, revalidate additions and reproduce reviewed report
        run: |
          python scripts/build_deferred_names_trial.py \
            --base-pack build/base-v9/cleverkeys-pl-shared-metadata-trial.zip \
            --source-audit build/source-v8/name-forms-audit.jsonl \
            --out-dir build/deferred-v10
          cmp build/deferred-v10/deferred-names-report.json docs/deferred-names-trial-v1/reviewed-report.json
      - name: Checkout unchanged verified APK readers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jakamilek/CleverKeysPL
          ref: 64943d82e4480c3e2afb5e3618a5e4e47fa4c6ff
          path: build/consumer
      - name: Verify all records, independent source expectations and restricted heaps
        run: |
          set -euo pipefail
          python scripts/check_deferred_names_consumer.py \
            --consumer build/consumer \
            --base-pack build/base-v9/cleverkeys-pl-shared-metadata-trial.zip \
            --pack build/deferred-v10/cleverkeys-pl-deferred-names-trial.zip \
            --expanded-additions build/deferred-v10/new-entries-expanded.jsonl \
            --build-dir build/jvm \
            | tee build/deferred-v10/actual-consumer-check.txt
      - name: Save validated additive trial ZIP and complete audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleverkeys-pl-deferred-names-trial
          path: build/deferred-v10/*
          retention-days: 30
