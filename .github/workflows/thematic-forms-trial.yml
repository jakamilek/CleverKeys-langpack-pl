name: Additive Polish thematic forms v7

on:
  push:
    branches: ['feature/additive-common-forms-v1']
    paths:
      - 'scripts/build_thematic_forms_trial.py'
      - 'scripts/check_common_forms_consumer.py'
      - 'source/thematic-v7/**'
      - 'tests/test_thematic_forms_trial.py'
      - 'tests/ThematicFormsMemoryCheck.kt'
      - 'docs/thematic-forms-trial-v1/**'
      - '.github/workflows/thematic-forms-trial.yml'
  pull_request:
    paths:
      - 'scripts/build_thematic_forms_trial.py'
      - 'scripts/check_common_forms_consumer.py'
      - 'source/thematic-v7/**'
      - 'tests/test_thematic_forms_trial.py'
      - 'tests/ThematicFormsMemoryCheck.kt'
      - 'docs/thematic-forms-trial-v1/**'
      - '.github/workflows/thematic-forms-trial.yml'

permissions:
  contents: read
  actions: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install exact lexical source snapshots
        run: |
          python -m pip install morfeusz2==1.99.15 requests \
            'wordfreq @ git+https://github.com/rspeer/wordfreq@912caf64b657478d1dff1138efdc078947d54bb1'
      - name: Verify source locks and additive invariants
        run: python -m unittest discover -s tests -v
      - name: Retrieve successful pinned v6
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38121444186
          name: cleverkeys-pl-common-forms-trial
          path: build/base-v6
      - name: Retrieve v5 for the original restricted-heap import gate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37202645255
          name: cleverkeys-pl-global-casing-trial
          path: build/base-v5
      - name: Append indexed exact source forms and reproduce reviewed report
        run: |
          python scripts/build_thematic_forms_trial.py \
            --base-pack build/base-v6/cleverkeys-pl-common-forms-trial.zip \
            --out-dir build/thematic-v7
          cmp build/thematic-v7/thematic-forms-report.json docs/thematic-forms-trial-v1/reviewed-report.json
      - name: Checkout the verified streaming consumer with fast Manager
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jakamilek/CleverKeysPL
          ref: 2f4735dd296e07bd8358ab8c71a3a58760e9cd0d
          path: build/consumer
      - name: Check actual readers and isolated real-pack memory workloads
        run: |
          set -euo pipefail
          python scripts/check_common_forms_consumer.py \
            --consumer build/consumer \
            --base-pack build/base-v6/cleverkeys-pl-common-forms-trial.zip \
            --pack build/thematic-v7/cleverkeys-pl-thematic-forms-trial.zip \
            --build-dir build/jvm \
            --thematic-memory-check \
            --legacy-base-pack build/base-v5/cleverkeys-pl-global-casing-trial.zip \
            | tee build/thematic-v7/actual-consumer-check.txt
      - name: Save validated trial ZIP and complete source audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleverkeys-pl-thematic-forms-trial
          path: build/thematic-v7/*
          retention-days: 30
