name: Source casing variant trial

on:
  push:
    branches: ['feature/source-variants-trial-v1']
  pull_request:
    paths:
      - 'scripts/build_variant_trial.py'
      - 'scripts/build_function_word_trial.py'
      - 'scripts/build_global_casing_trial.py'
      - 'tests/test_global_casing_trial.py'
      - 'scripts/capitalization_rules.py'
      - 'tests/test_function_word_trial.py'
      - 'tests/test_variant_trial.py'
      - 'tests/fixtures/source-casing-proof-v1.json'
      - 'docs/VARIANT_TRIAL_NOTICE.txt'
      - '.github/workflows/variant-trial.yml'

permissions:
  contents: read
  actions: read

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test producer and source contract
        run: python3 -m unittest discover -s tests -p 'test_variant_trial.py' -v
      - name: Install pinned casing oracle
        run: python3 -m pip install morfeusz2==1.99.15
      - name: Test function-word casing and binary invariants
        run: python3 -m unittest discover -s tests -p 'test_function_word_trial.py' -v
      - name: Retrieve the pinned successful preview
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36916501466
          name: cleverkeys-pl-preview
          path: build/variant-source
      - name: Build the trial without changing CKDT
        run: |
          python3 scripts/build_variant_trial.py \
            --base-pack build/variant-source/build/cleverkeys-langpack-pl-preview.zip \
            --evidence tests/fixtures/source-casing-proof-v1.json \
            --evidence-sha256 6bbdf928c338d44ab3eddb76f8a1fe9f0b4a789cb1d51f55740f55826a21e2e2 \
            --notice docs/VARIANT_TRIAL_NOTICE.txt \
            --out-dir build/variant-trial
      - name: Correct source-attested function-word defaults (pack v4)
        run: |
          python3 scripts/build_function_word_trial.py \
            --base-pack build/variant-trial/cleverkeys-pl-variants-trial.zip \
            --out-dir build/function-word-trial
      - name: Compare corrected artifact with reviewed report
        run: cmp build/function-word-trial/function-word-trial-report.json docs/function-word-trial-v1/function-word-trial-report.json
      - name: Test global casing, source readings and Android limits
        run: python3 -m unittest discover -s tests -p 'test_global_casing_trial.py' -v
      - name: Audit every key and export case homonyms (pack v5)
        run: |
          python3 scripts/build_global_casing_trial.py \
            --base-pack build/function-word-trial/cleverkeys-pl-function-words-trial.zip \
            --out-dir build/global-casing-trial
      - name: Compare global artifact with reviewed report
        run: cmp build/global-casing-trial/global-casing-reviewed-summary.json docs/global-casing-trial-v1/global-casing-reviewed-summary.json
      - name: Save global casing pack and full source audit
        uses: actions/upload-artifact@v4
        with:
          name: cleverkeys-pl-global-casing-trial
          path: build/global-casing-trial/*
      - name: Save the corrected trial and audit
        uses: actions/upload-artifact@v4
        with:
          name: cleverkeys-pl-function-words-trial
          path: build/function-word-trial/*
