name: Additive Polish names and initialisms v8

on:
  push:
    branches: ['feature/additive-common-forms-v1']
    paths:
      - 'scripts/build_names_forms_trial.py'
      - 'scripts/check_names_forms_consumer.py'
      - 'tests/test_names_forms_trial.py'
      - 'tests/NamesFormsMemoryCheck.kt'
      - 'docs/names-forms-trial-v1/**'
      - '.github/workflows/names-forms-trial.yml'
  pull_request:
    paths:
      - 'scripts/build_names_forms_trial.py'
      - 'scripts/check_names_forms_consumer.py'
      - 'tests/test_names_forms_trial.py'
      - 'tests/NamesFormsMemoryCheck.kt'
      - 'docs/names-forms-trial-v1/**'
      - '.github/workflows/names-forms-trial.yml'

permissions:
  contents: read
  actions: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install exact lexical source snapshots
        run: |
          python -m pip install morfeusz2==1.99.15 requests \
            'wordfreq @ git+https://github.com/rspeer/wordfreq@912caf64b657478d1dff1138efdc078947d54bb1'
      - name: Verify source locks and additive invariants
        run: python -m unittest discover -s tests -v
      - name: Retrieve successful pinned v7 accepted on phone
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38139409942
          name: cleverkeys-pl-thematic-forms-trial
          path: build/base-v7
      - name: Measure source families, append within bounds and reproduce reviewed report
        run: |
          python scripts/build_names_forms_trial.py \
            --base-pack build/base-v7/cleverkeys-pl-thematic-forms-trial.zip \
            --out-dir build/names-v8
          cmp build/names-v8/names-forms-report.json docs/names-forms-trial-v1/reviewed-report.json
      - name: Checkout verified streaming and shared-snapshot consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jakamilek/CleverKeysPL
          ref: 141f27e7e780f00451b50887603cd885d015a72c
          path: build/consumer
      - name: Check actual readers, source-case presentation and isolated memory workloads
        run: |
          set -euo pipefail
          python scripts/check_names_forms_consumer.py \
            --consumer build/consumer \
            --base-pack build/base-v7/cleverkeys-pl-thematic-forms-trial.zip \
            --pack build/names-v8/cleverkeys-pl-names-forms-trial.zip \
            --build-dir build/jvm \
            | tee build/names-v8/actual-consumer-check.txt
      - name: Save validated trial ZIP and complete source audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleverkeys-pl-names-forms-trial
          path: build/names-v8/*
          retention-days: 30
