name: Polish proper-noun coverage audit

on:
  workflow_dispatch:
  push:
    branches:
      - "ops/baseline-sync-2026-09-20"
    paths:
      - "scripts/audit_proper_nouns.py"
      - "scripts/build_pl_preview.py"
      - "scripts/requirements-pl-audit.txt"
      - "scripts/requirements-pl-proper-noun-audit.txt"
      - "sources/staging/reviewed_proper_nouns.tsv"
      - "sources/staging/autocorrect_errors.tsv"
      - "sources/staging/reviewed_morphology.tsv"
      - ".github/workflows/pl-proper-noun-audit.yml"

permissions:
  contents: read

jobs:
  proper-noun-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout language project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Polish spelling and morphology tools
        run: |
          sudo apt-get update
          sudo apt-get install -y hunspell hunspell-pl
          python3 -m pip install --upgrade pip
          python3 -m pip install -r scripts/requirements-pl-audit.txt
          python3 -m pip install -r scripts/requirements-pl-proper-noun-audit.txt

      - name: Acquire pinned AOSP Polish dictionary
        run: |
          set -euo pipefail
          mkdir -p build/aosp
          curl --fail --location "https://android.googlesource.com/platform/packages/inputmethods/LatinIME/+/refs/heads/main/dictionaries/pl_wordlist.combined.gz?format=TEXT" -o build/aosp/pl_wordlist.combined.gz.base64
          base64 --decode build/aosp/pl_wordlist.combined.gz.base64 > build/aosp/pl_wordlist.combined.gz
          sha256sum build/aosp/pl_wordlist.combined.gz | awk '{print $1}' > build/aosp/pl_wordlist.combined.gz.sha256
          test "$(cat build/aosp/pl_wordlist.combined.gz.sha256)" = "75a7a488e014ec3b9dbdb2527f09bca6bb28c250232d9ba50cb0ee1f8738ea45"
          printf '%s\n' 'android.googlesource.com/platform/packages/inputmethods/LatinIME' 'refs/heads/main' 'dictionaries/pl_wordlist.combined.gz' 'sha256=75a7a488e014ec3b9dbdb2527f09bca6bb28c250232d9ba50cb0ee1f8738ea45' 'directory-tree=2b550379fe38213f9b01dcb75478ef2133682685' > build/aosp/source-ref.txt

      - name: Build audited 100k Polish candidate list
        run: |
          python3 scripts/build_pl_preview.py --top 200000 --band 100000 --limit 100000 --aosp build/aosp/pl_wordlist.combined.gz --morphology sources/staging/reviewed_morphology.tsv --proper-nouns sources/staging/reviewed_proper_nouns.tsv --out-wordlist build/pl_words_100k.txt --out-report build/pl-preview-report.json

      - name: Pin CleverKeys runtime
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/tribixbite/CleverKeys.git build/CleverKeys-runtime
          git -C build/CleverKeys-runtime fetch --depth=1 origin 263bd0abc03dec420f60fa073a9d2c5e25a176b5
          git -C build/CleverKeys-runtime checkout --detach 263bd0abc03dec420f60fa073a9d2c5e25a176b5
          test "$(git -C build/CleverKeys-runtime rev-parse HEAD)" = "263bd0abc03dec420f60fa073a9d2c5e25a176b5"

      - name: Build pinned CKDT V2 dictionary
        run: |
          python3 build/CleverKeys-runtime/scripts/build_dictionary.py --lang pl --input build/pl_words_100k.txt --output build/dictionary.bin --use-wordfreq

      - name: Extract canonical surfaces from CKDT
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          data = Path("build/dictionary.bin").read_bytes()
          magic, version = struct.unpack_from("<II", data, 0)
          assert magic == 0x54444B43 and version == 2
          count = struct.unpack_from("<I", data, 12)[0]

          p = 48
          words = []
          for _ in range(count):
              n = struct.unpack_from("<H", data, p)[0]
              p += 2
              words.append(data[p:p+n].decode("utf-8"))
              p += n + 1

          assert len(words) == count
          Path("build/pl_words_100k.ckdt.txt").write_text(chr(10).join(words) + chr(10), encoding="utf-8")
          print(f"extracted {count} canonical CKDT surfaces")
          PY

      - name: Audit official Polish names and localities
        run: |
          set -euo pipefail
          python3 scripts/audit_proper_nouns.py --wordlist build/pl_words_100k.ckdt.txt --reviewed-proper-nouns sources/staging/reviewed_proper_nouns.tsv --out-report build/proper-noun-audit-report.json --out-tsv build/proper-noun-audit.tsv --out-sources build/proper-noun-audit-sources.json --workdir build/proper-noun-sources

      - name: Verify audit outputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/proper-noun-audit-report.json").read_text(encoding="utf-8"))
          assert report["mode"] == "audit-only"
          assert report["promotion"] is False
          assert report["pack_word_count"] == 100000
          assert report["candidates"]["already_canonical"] >= 0
          assert report["candidates"]["lowercase_only"] >= 0
          assert report["candidates"]["missing_from_pack"] >= 0

          reviewed_missing = [
              row for row in Path("build/proper-noun-audit.tsv").read_text(encoding="utf-8").splitlines()[1:]
              if row and row.split(chr(9))[4] == "True" and row.split(chr(9))[3] == "missing_from_pack"
          ]
          assert not reviewed_missing, "reviewed proper-noun source contains forms missing from the 100k pack: " + "; ".join(reviewed_missing[:20])

          print(json.dumps({
              "pack_word_count": report["pack_word_count"],
              "source_counts": report["source_counts"],
              "coverage": report["coverage"],
              "candidates": report["candidates"],
              "morphology_scope": report["morphology_scope"],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish proper-noun audit
        uses: actions/upload-artifact@v4
        with:
          name: cleverkeys-pl-proper-noun-audit
          path: |
            build/proper-noun-audit-report.json
            build/proper-noun-audit.tsv
            build/proper-noun-audit-sources.json
            build/pl-preview-report.json
            build/pl_words_100k.txt
            build/pl_words_100k.ckdt.txt
            build/dictionary.bin
            build/aosp/pl_wordlist.combined.gz.sha256
            build/aosp/source-ref.txt
            sources/staging/reviewed_proper_nouns.tsv
