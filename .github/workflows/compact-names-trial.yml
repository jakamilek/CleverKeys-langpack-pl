name: Additive compact Polish names v12

on:
  push:
    branches: ['feature/additive-common-forms-v1']
    paths:
      - 'scripts/build_compact_names_trial.py'
      - 'scripts/build_deferred_names_trial.py'
      - 'scripts/build_compact_source_trial.py'
      - 'scripts/check_compact_names_consumer.py'
      - 'tests/test_compact_names_trial.py'
      - 'tests/CompactNamesConsumerCheck.kt'
      - 'docs/compact-names-trial-v1/**'
      - '.github/workflows/compact-names-trial.yml'
  pull_request:
    paths:
      - 'scripts/build_compact_names_trial.py'
      - 'scripts/build_deferred_names_trial.py'
      - 'scripts/build_compact_source_trial.py'
      - 'scripts/check_compact_names_consumer.py'
      - 'tests/test_compact_names_trial.py'
      - 'tests/CompactNamesConsumerCheck.kt'
      - 'docs/compact-names-trial-v1/**'
      - '.github/workflows/compact-names-trial.yml'

permissions:
  contents: read
  actions: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install exact source snapshots
        run: |
          python -m pip install morfeusz2==1.99.15 requests \
            'wordfreq @ git+https://github.com/rspeer/wordfreq@912caf64b657478d1dff1138efdc078947d54bb1'
      - name: Verify complete producer regressions
        run: python -m unittest discover -s tests -v
      - name: Retrieve successful phone-accepted v11
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38437507820
          name: cleverkeys-pl-compact-source-trial
          path: build/base-v11
      - name: Retrieve complete pinned v8 source audit
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38167348861
          name: cleverkeys-pl-names-forms-trial
          path: build/source-v8
      - name: Measure deferred pool, revalidate additions and reproduce reviewed report
        run: |
          python scripts/build_compact_names_trial.py \
            --base-pack build/base-v11/cleverkeys-pl-compact-source-trial.zip \
            --source-audit build/source-v8/name-forms-audit.jsonl \
            --out-dir build/compact-names-v12
          cmp build/compact-names-v12/compact-names-report.json docs/compact-names-trial-v1/reviewed-report.json
      - name: Checkout unchanged verified APK readers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jakamilek/CleverKeysPL
          ref: 0b94e323789e96c44a77f762a6f83fa11e285699
          path: build/consumer
      - name: Verify all records, independent source expectations and restricted heaps
        run: |
          set -euo pipefail
          python scripts/check_compact_names_consumer.py \
            --consumer build/consumer \
            --base-pack build/base-v11/cleverkeys-pl-compact-source-trial.zip \
            --pack build/compact-names-v12/cleverkeys-pl-compact-names-trial.zip \
            --expanded-additions build/compact-names-v12/new-entries-expanded.jsonl \
            --build-dir build/jvm \
            | tee build/compact-names-v12/actual-consumer-check.txt
      - name: Save validated additive trial ZIP and complete audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleverkeys-pl-compact-names-trial
          path: build/compact-names-v12/*
          retention-days: 30
