name: First-name 235-per-gender selection audit

on:
  push:
    branches:
      - "ops/baseline-sync-2026-09-20"
    paths:
      - "scripts/audit_first_name_core.py"
      - ".github/workflows/pl-first-name-core-audit.yml"
      - "scripts/build_pl_preview.py"
      - "scripts/audit_name_history.py"
      - "scripts/requirements-pl-audit.txt"
      - "sources/staging/autocorrect_errors.tsv"
      - "sources/staging/reviewed_morphology.tsv"
      - "sources/staging/reviewed_proper_nouns.tsv"
      - "sources/staging/historical_name_candidates.tsv"
      - "sources/staging/first_name_source_exclusions.tsv"
      - "scripts/capitalization_rules.py"
      - "docs/PL_NAME_HISTORY_SOURCE_POLICY_2026-09-23.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-modern-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Polish spelling oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y hunspell hunspell-pl

      - name: Install pinned wordfreq
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r scripts/requirements-pl-audit.txt

      - name: Acquire pinned AOSP Polish dictionary
        run: |
          mkdir -p build/aosp
          curl --fail --location 'https://android.googlesource.com/platform/packages/inputmethods/LatinIME/+/refs/heads/main/dictionaries/pl_wordlist.combined.gz?format=TEXT' -o build/aosp/pl_wordlist.combined.gz.base64
          base64 --decode build/aosp/pl_wordlist.combined.gz.base64 > build/aosp/pl_wordlist.combined.gz
          test "$(sha256sum build/aosp/pl_wordlist.combined.gz | awk '{print $1}')" = "75a7a488e014ec3b9dbdb2527f09bca6bb28c250232d9ba50cb0ee1f8738ea45"

      - name: Build modern name history core and preview
        run: |
          python3 scripts/audit_name_history.py             --out-report build/pl-name-history-report.json             --out-tsv build/pl-name-history.tsv             --out-core build/pl-name-history-core-215-each-gender.txt             --out-buffer build/pl-name-history-buffer-216-300.tsv             --workdir build/pl-name-history-sources             --core-per-gender 215             --buffer-end-rank 300
          python3 scripts/build_pl_preview.py             --top 200000 --band 100000 --limit 100000             --aosp build/aosp/pl_wordlist.combined.gz             --first-name-history build/pl-name-history-report.json             --historical-first-names sources/staging/historical_name_candidates.tsv --first-name-source-exclusions sources/staging/first_name_source_exclusions.tsv             --out-wordlist build/pl_words_preview.txt             --out-report build/pl-preview-report.json

      - name: Audit first-name common-noun homonyms
        run: |
          python3 scripts/audit_first_name_homonyms.py             --history-report build/pl-name-history-report.json             --historical-first-names sources/staging/historical_name_candidates.tsv             --out-json build/pl-first-name-homonym-audit.json             --out-tsv build/pl-first-name-homonym-audit.tsv             --exclusions sources/staging/first_name_source_exclusions.tsv

      - name: Audit 470 selected first names
        run: |
          python3 scripts/audit_first_name_core.py             --history-report build/pl-name-history-report.json             --preview-wordlist build/pl_words_preview.txt             --aosp build/aosp/pl_wordlist.combined.gz             --first-name-source-exclusions sources/staging/first_name_source_exclusions.tsv             --historical-first-names sources/staging/historical_name_candidates.tsv             --out-json build/pl-first-name-core-audit.json             --out-tsv build/pl-first-name-core-audit.tsv

      - name: Verify core size and no regression blocklisted names
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/pl-first-name-core-audit.json").read_text(encoding="utf-8"))
          assert r["counts"]["core_total"] == 470
          assert r["counts"]["female"] == 235
          assert r["counts"]["male"] == 235
          assert r["counts"]["historical_female"] == 20
          assert r["counts"]["historical_male"] == 20
          assert r["counts"]["regression_blocked"] == 0
          assert r["counts"]["active_selected_in_preview"] == 469
          assert r["counts"]["excluded_selected"] == 1
          assert r["counts"]["all_selected_in_preview"] is True
          print(json.dumps(r["counts"], ensure_ascii=False, indent=2))
          PY

      - name: Publish core audit
        uses: actions/upload-artifact@v4
        with:
          name: cleverkeys-pl-first-name-core-audit
          path: |
            build/pl-first-name-core-audit.json
            build/pl-first-name-core-audit.tsv
            sources/staging/historical_name_candidates.tsv
            sources/staging/first_name_source_exclusions.tsv
            build/pl-name-history-report.json
            build/pl-name-history-core-215-each-gender.txt
            build/pl-name-history-buffer-216-300.tsv
            build/pl-preview-report.json
            build/pl-first-name-homonym-audit.json
            build/pl-first-name-homonym-audit.tsv
