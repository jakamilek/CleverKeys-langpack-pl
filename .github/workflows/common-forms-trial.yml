name: Additive Polish common forms v6

on:
  push:
    branches: ['feature/additive-common-forms-v1']
  pull_request:
    paths:
      - 'scripts/build_common_forms_trial.py'
      - 'scripts/check_common_forms_consumer.py'
      - 'tests/test_common_forms_trial.py'
      - 'tests/CommonFormsConsumerCheck.kt'
      - 'tests/fixtures/common-forms-jvm-tools.json'
      - 'docs/common-forms-trial-v1/**'
      - '.github/workflows/common-forms-trial.yml'

permissions:
  contents: read
  actions: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install exact lexical source snapshots
        run: |
          python -m pip install morfeusz2==1.99.15 requests \
            'wordfreq @ git+https://github.com/rspeer/wordfreq@912caf64b657478d1dff1138efdc078947d54bb1'
      - name: Test source, old casing and additive invariants
        run: python -m unittest discover -s tests -v
      - name: Retrieve the pinned successful v5 with its complete audit
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37202645255
          name: cleverkeys-pl-global-casing-trial
          path: build/base-v5
      - name: Append globally selected attested common forms
        run: |
          python scripts/build_common_forms_trial.py \
            --base-pack build/base-v5/cleverkeys-pl-global-casing-trial.zip \
            --base-audit build/base-v5/global-casing-audit.jsonl \
            --out-dir build/common-forms-v6
          cmp build/common-forms-v6/common-forms-report.json docs/common-forms-trial-v1/reviewed-report.json
      - name: Checkout the exact compatible live consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jakamilek/CleverKeysPL
          ref: 455eec6e59f66c2422d6c0a485f9dc1084dc49e6
          path: build/consumer
      - name: Verify the full pack with actual Kotlin readers and boundary tests
        run: |
          python scripts/check_common_forms_consumer.py \
            --consumer build/consumer \
            --base-pack build/base-v5/cleverkeys-pl-global-casing-trial.zip \
            --pack build/common-forms-v6/cleverkeys-pl-common-forms-trial.zip \
            --build-dir build/jvm
      - name: Save only the validated trial pack and source audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleverkeys-pl-common-forms-trial
          path: build/common-forms-v6/*
          retention-days: 30
