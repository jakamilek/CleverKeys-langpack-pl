name: Lossless shared Polish metadata v9

on:
  push:
    branches: ['feature/additive-common-forms-v1']
    paths:
      - 'scripts/shared_metadata_v2.py'
      - 'scripts/build_shared_metadata_trial.py'
      - 'scripts/check_shared_metadata_consumer.py'
      - 'tests/test_shared_metadata_trial.py'
      - 'docs/shared-metadata-trial-v1/**'
      - '.github/workflows/shared-metadata-trial.yml'
  pull_request:
    paths:
      - 'scripts/shared_metadata_v2.py'
      - 'scripts/build_shared_metadata_trial.py'
      - 'scripts/check_shared_metadata_consumer.py'
      - 'tests/test_shared_metadata_trial.py'
      - 'docs/shared-metadata-trial-v1/**'
      - '.github/workflows/shared-metadata-trial.yml'

permissions:
  contents: read
  actions: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned lexical regression snapshots
        run: |
          python -m pip install morfeusz2==1.99.15 requests \
            'wordfreq @ git+https://github.com/rspeer/wordfreq@912caf64b657478d1dff1138efdc078947d54bb1'
      - name: Verify full producer regressions
        run: python -m unittest discover -s tests -v
      - name: Retrieve successful pinned v8 accepted on phone
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38167348861
          name: cleverkeys-pl-names-forms-trial
          path: build/base-v8
      - name: Reconstruct exact metadata and reproduce reviewed package
        run: |
          python scripts/build_shared_metadata_trial.py \
            --base-pack build/base-v8/cleverkeys-pl-names-forms-trial.zip \
            --out-dir build/shared-v9
          cmp build/shared-v9/shared-metadata-report.json docs/shared-metadata-trial-v1/reviewed-report.json
      - name: Checkout pinned API/schema-v2 consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jakamilek/CleverKeysPL
          ref: 64943d82e4480c3e2afb5e3618a5e4e47fa4c6ff
          path: build/consumer
      - name: Verify actual readers, exact SI metadata and three restricted-heap workloads
        run: |
          set -euo pipefail
          python scripts/check_shared_metadata_consumer.py \
            --consumer build/consumer \
            --base-pack build/base-v8/cleverkeys-pl-names-forms-trial.zip \
            --pack build/shared-v9/cleverkeys-pl-shared-metadata-trial.zip \
            --build-dir build/jvm \
            | tee build/shared-v9/actual-consumer-check.txt
      - name: Save validated compatible trial ZIP and report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleverkeys-pl-shared-metadata-trial
          path: build/shared-v9/*
          retention-days: 30
