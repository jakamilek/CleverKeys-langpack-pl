name: Lossless compact Polish source v11

on:
  push:
    branches: ['feature/additive-common-forms-v1']
    paths:
      - 'scripts/build_deferred_names_trial.py'
      - 'scripts/build_compact_source_trial.py'
      - 'scripts/check_compact_source_consumer.py'
      - 'tests/test_compact_source_trial.py'
      - 'tests/CompactSourceConsumerCheck.kt'
      - 'docs/compact-source-trial-v1/**'
      - '.github/workflows/compact-source-trial.yml'
  pull_request:
    paths:
      - 'scripts/build_deferred_names_trial.py'
      - 'scripts/build_compact_source_trial.py'
      - 'scripts/check_compact_source_consumer.py'
      - 'tests/test_compact_source_trial.py'
      - 'tests/CompactSourceConsumerCheck.kt'
      - 'docs/compact-source-trial-v1/**'
      - '.github/workflows/compact-source-trial.yml'

permissions:
  contents: read
  actions: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned lexical regression snapshots
        run: |
          python -m pip install morfeusz2==1.99.15 requests \
            'wordfreq @ git+https://github.com/rspeer/wordfreq@912caf64b657478d1dff1138efdc078947d54bb1'
      - name: Verify full producer regressions
        run: python -m unittest discover -s tests -v
      - name: Retrieve successful pinned v10 accepted on phone
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 38301095587
          name: cleverkeys-pl-deferred-names-trial
          path: build/base-v10
      - name: Reconstruct exact metadata and reproduce reviewed package
        run: |
          python scripts/build_compact_source_trial.py \
            --base-pack build/base-v10/cleverkeys-pl-deferred-names-trial.zip \
            --out-dir build/compact-v11
          cmp build/compact-v11/compact-source-report.json docs/compact-source-trial-v1/reviewed-report.json
      - name: Checkout pinned API/schema-v3 consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jakamilek/CleverKeysPL
          ref: 0b94e323789e96c44a77f762a6f83fa11e285699
          path: build/consumer
      - name: Verify actual readers, exact SI metadata and three restricted-heap workloads
        run: |
          set -euo pipefail
          python scripts/check_compact_source_consumer.py \
            --consumer build/consumer \
            --base-pack build/base-v10/cleverkeys-pl-deferred-names-trial.zip \
            --pack build/compact-v11/cleverkeys-pl-compact-source-trial.zip \
            --build-dir build/jvm \
            | tee build/compact-v11/actual-consumer-check.txt
      - name: Save validated compatible trial ZIP and report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleverkeys-pl-compact-source-trial
          path: build/compact-v11/*
          retention-days: 30
